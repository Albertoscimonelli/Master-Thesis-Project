[pycodestyle]
# PEP8 con deroga sulla lunghezza riga: 79 caratteri e' troppo stretto per il
# codice scientifico con nomi descrittivi e chiamate a pandas/numpy annidate.
# 99 e' il compromesso adottato dal progetto.
max-line-length = 99
exclude = venv,__pycache__,.git

[flake8]
max-line-length = 99
exclude = venv,__pycache__,.git
