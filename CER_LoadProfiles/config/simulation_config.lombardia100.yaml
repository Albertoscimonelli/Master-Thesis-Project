# SOCIETA' LOMBARDA - cento famiglie, allocazione dimensione x tipo dal
# censimento e da ISTAT AVQ 2024.
#
# NON ANCORA ESEGUITA. Questo file e' stato generato e sottoposto a revisione
# prima del run: a 100 famiglie il tempo atteso e' ~2 minuti/famiglia, cioe'
# 3-3,5 ore filate (contro i 40-45 minuti della versione da 20). Vedi
# outputs/tables/composizione_cer_scalata.md per la tabella completa su tutte
# le taglie intermedie (3-100) da cui questo file deriva la colonna Lombardia.
#
# DA DOVE VIENE LA COMPOSIZIONE.
#   ISTAT, Aspetti della vita quotidiana 2024, microdati, Lombardia: 1.831
#   famiglie, 4.139 individui, copertura 100% dei componenti. Pesi COEFIN
#   originali (non ricalibrati): 4,56 milioni di famiglie contro 4,57 del
#   censimento.
#   ISTAT, Censimento permanente della popolazione 2021 (rilascio 2023), dati
#   per sezione, aggregato Lombardia: famiglie per numero di componenti
#   (PF3-PF8), popolazione 65+ (P27-P29).
#   ISTAT, Dotazioni energetiche delle famiglie 2024, Tavola 3: 55,6% delle
#   famiglie lombarde ha un impianto di raffrescamento.
#
# ALLOCAZIONE GERARCHICA (tipologie_famiglie.py --famiglie 100), risultato:
#
#   componenti  nessun occ.  pensionati  un adulto in casa  tutti occ.  tot.
#   1                  4          17            0               17      38
#   2                  4           9            8                8      29
#   3                  2           0            9                6      17
#   4                  1           0            6                5      12
#   5+                 0           0            3                1       4
#   -----------------------------------------------------------------------
#   totale            11          26           26               37     100
#
# DA CELLA A FAMIGLIE: CATALOGO E RIPETIZIONI. Il catalogo italiano ha 66
# template (interrogato da lpgdata.Households). Ogni cella e' stata riempita
# con TUTTI i template distinti disponibili per quella combinazione
# dimensione x tipo (classificati dal nome LPG, che codifica esplicitamente
# eta', numero di componenti e stato occupazionale - stessa convenzione gia'
# usata in simulation_config.lombardia20.yaml); quando la cella richiede piu'
# famiglie dei template distinti disponibili, i template si RIPETONO con seed
# diversi (_seed_stabile(label, indice) in lpg_runner.py). La Fase 4 ha
# misurato che l'identita' dell'archetipo pesa 7,6 volte il seme: ripetere lo
# stesso archetipo con semi diversi e' quindi una scelta dichiarata e non un
# compromesso nascosto. Distribuzione dei ripetuti (il piu' possibile pari,
# a resto maggiore):
#   1 comp. pensionati:      17 su 4 template (CHR23,24,30,31)      5/4/4/4
#   1 comp. tutti occupati:  17 su 9 template                        2 x8, 1 x1
#   2 comp. pensionati:       9 su 5 template                        2 x4, 1 x1
#   2 comp. un adulto in casa: 8 su 2 template (CHR04, CHR34)         4/4
#   3 comp. un adulto in casa: 9 su 3 template                       3/3/3
#   3 comp. tutti occupati:   6 su 4 template                        2/2/1/1
#   4 comp. tutti occupati:   5 su 1 solo template (CHR27)            5x lo stesso
#   4 comp. un adulto in casa: 6 su 5 template                       2/1/1/1/1
#   5+ un adulto in casa:     3 su 2 template (CHR20, CHR15)          2/1
#   Le altre celle hanno abbastanza template distinti da non ripetere affatto
#   (1n, 2n, 2t, 3n, 3t parziale, 4n, 4u parziale, 5t).
#
# CLASSIFICAZIONE DEI TEMPLATE PER CELLA: ASSUNZIONE DICHIARATA. Non esiste
# nel database pyLPG una colonna "numero componenti" o "stato occupazionale"
# gia' pronta all'uso: la classificazione qui usata legge il nome del
# template (che LPG assegna in modo sistematico, es. "1 at work, 1 at home",
# "without work", "over 65 years") - stessa convenzione con cui
# lombardia20.yaml aveva gia' scelto i suoi venti template. Non e' stata
# verificata riga per riga contro tblTemplatePerson/tblTemplatePersonTrait del
# .db3. Esclusi dal catalogo: CHR62 (casa vacanze, presenza di un mese solo:
# non rappresentativo di un socio CER stabile) e CHR52 (Student Flatsharing,
# dimensione del nucleo non dichiarata nel nome).
#
# RAFFRESCAMENTO: 54 famiglie su 100 (54,0%) contro il 55,6% ISTAT - il
# residuo viene dall'arrotondamento a resto maggiore applicato CELLA PER
# CELLA (non sul totale): stesso tipo di scostamento gia' dichiarato in
# lombardia20.yaml per le famiglie con minori (25% contro 21,7% atteso).
# Distribuito su tutte le celle e non concentrato su una tipologia.
#
# CLASSE DI POTENZA: stessa regola delle configurazioni sorelle - fino a due
# componenti 1,5-3 kW, da tre in su 3-4,5 kW. Non e' letta dalla pipeline,
# serve all'analisi a valle per la curva ARERA di confronto.
#
# RIPRODUCIBILITA'. Questo file e la tabella dei conteggi per cella sono
# generati da uno script che riusa tipologie_famiglie.py
# (famiglie_avq/marginali_censimento/allocazione) e interroga lpgdata.Households
# per il catalogo. Nessun conteggio qui e' scritto a mano.
#
# Uso (~3-3,5 ore):
#   python generate_load_profiles.py --config config/simulation_config.lombardia100.yaml

simulation:
